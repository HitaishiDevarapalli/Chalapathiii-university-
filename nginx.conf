server {
    listen 80 default_server;
    server_name _ chalapathiuniversity.edu.in www.chalapathiuniversity.edu.in;

    # Increase max upload size to 500MB for photos, videos, and large payloads
    client_max_body_size 500M;

    # Performance: Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Serve React static files natively
    location / {
        root /var/www/chalapathi;
        index index.html index.htm;
        # React Router fallback
        try_files $uri $uri/ /index.html;
    }

    # Browser caching for images, media, and static assets
    location ~* \.(ico|css|js|gif|jpeg|jpg|png|webp|svg|woff|woff2|ttf|mp4)$ {
        root /var/www/chalapathi;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Proxy API requests to the native Node.js backend
    location /api/ {
        proxy_pass http://localhost:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Real IP headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy Uploads folder with client caching (^~ prevents regex static block interception)
    location ^~ /uploads/ {
        proxy_pass http://localhost:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
